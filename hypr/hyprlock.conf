# hyprlock -- the FALLBACK lock (only used when the Quickshell shell is not
# running; see hypridle.conf). Restyled 6 Oct 2026 as the still version of
# the shell's glass lock screen (shell/lock/GlassLockSurface.qml): blurred
# desktop, big white Poppins clock, ringed avatar, name, a translucent
# capsule password field and the footer, at the same positions (1080p
# frame). hyprlock can't run shaders, so there is no frosted clock or 3D
# tilt here.
source=~/.config/hypr/hyprlock/colors.conf

general {
    hide_cursor = true
}

background {
    monitor =
    path = screenshot
    blur_passes = 4
    blur_size = 10
    brightness = 0.8
    contrast = 0.9
    vibrancy = 0.2
    noise = 0.015
}

label { # Clock
    monitor =
    text = $TIME
    color = rgba(255, 255, 255, 0.9)
    font_size = 150
    font_family = Poppins SemiBold
    shadow_passes = 2
    shadow_size = 6
    shadow_color = rgba(0, 0, 0, 0.25)
    position = 0, 290
    halign = center
    valign = center
}

image { # Avatar with a thick white ring
    monitor =
    path = ~/.face
    size = 170
    rounding = -1
    border_size = 8
    border_color = rgba(255, 255, 255, 1.0)
    position = 0, 18
    halign = center
    valign = center
}

label { # Name
    monitor =
    text = $USER
    color = rgba(255, 255, 255, 1.0)
    font_size = 34
    font_family = Poppins SemiBold
    position = 0, -113
    halign = center
    valign = center
}

input-field { # Glass capsule
    monitor =
    size = 300, 56
    rounding = -1
    outline_thickness = 1
    outer_color = rgba(255, 255, 255, 0.38)
    inner_color = rgba(255, 255, 255, 0.12)
    font_color = rgba(255, 255, 255, 1.0)
    font_family = Poppins
    check_color = rgba(255, 255, 255, 0.6)
    fail_color = rgba(255, 105, 97, 0.9)
    fail_text = <i>Try again</i>
    placeholder_text = <span foreground="##ffffffa6">Password</span>
    dots_size = 0.22
    dots_spacing = 0.45
    dots_center = true
    fade_on_empty = false
    shadow_passes = 2
    shadow_size = 8
    shadow_color = rgba(0, 0, 0, 0.18)
    position = 0, -218
    halign = center
    valign = center
}

label { # Footer
    monitor =
    text = Arch Linux
    color = rgba(255, 255, 255, 1.0)
    font_size = 30
    font_family = Poppins SemiBold
    position = 0, 56
    halign = center
    valign = bottom
}
