# This configuration is normally generated by matugen from your wallpaper.
# These are placeholder defaults so hyprlock has something sane before you've
# run matugen (or the qml-rice wallpaper picker, which runs it for you).

$text_color = rgba(bfe9ffFF)
$entry_background_color = rgba(001f2a11)
$entry_border_color = rgba(8a929755)
$entry_color = rgba(bfe9ffFF)
$font_family = sans-serif
$font_family_clock = sans-serif
$font_material_symbols = Material Symbols Rounded

# Set this to your own wallpaper if you want hyprlock to render one directly
# (most people don't need this -- hyprlock just shows a solid background
# color by default in this config).
# $background_image = ~/Pictures/wallpaper.jpg
