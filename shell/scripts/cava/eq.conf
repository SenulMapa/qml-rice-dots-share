# Feeds island/Eq.qml's 4-bar pill meter via services/VisualizerService.qml.
#
# lower/higher cutoff: the default 50-10000 Hz split across 4 logarithmic
# bars came out balanced on measurement (bar means 356-531 of a 0-1000
# range, none under 20% of another) -- no per-bar gain hack needed.
#
# REVISED (calmer, "musical, not a literal spectrum" pass). The previous
# tuning here (noise_reduction 10, 60fps) deliberately chased maximum
# reactivity/liveliness -- that is exactly what the owner asked to walk
# back: "don't make it so aggressively a literal visualizer". noise_reduction
# 20 was cava's OWN smoothing baseline before that pass and is restored here,
# now layered UNDER VisualizerService.qml's own asymmetric attack/decay
# smoothing and inter-bar mean-blend rather than instead of it, so the
# damping isn't fighting a maximally-twitchy source signal.
#
# framerate: 240 -> 30 (27 Sep 2026, laptop pass). 240 was a desktop-only
# bump for that machine's 240Hz monitor; this ThinkPad's panel is a plain
# 60Hz output, so cava was doing FFT + parsing 4x more often than the
# display could ever show, and 8x more than the QML side needed to read.
# Measured with music playing on AC (top 8s samples): qs 45% / cava 15% /
# Hyprland 12.5% CPU with the edge visualizer also on. 30, not 60, because
# the reasoning right above already argues it's perceptually lossless here:
# VisualizerService.qml's own smoothing (rise ~75ms / fall ~300ms) already
# interpolates well past what a 30fps source can distinguish, so the pill
# was never going to look different at 240 vs 60 vs 30 raw samples once it
# is this heavily damped.
#
# monstercat: mild inter-bar smoothing (cava's own, on top of the
# 30%-toward-group-mean blend done in VisualizerService.qml) so a single
# transient doesn't spike one bar in isolation. Kept low (20) -- with only 4
# bars, a high value would smear them into looking like one blob instead of
# a meter.

[general]
bars = 4
framerate = 30
autosens = 1
lower_cutoff_freq = 50
higher_cutoff_freq = 10000

[input]
method = pipewire
source = auto

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 1000
channels = mono
mono_option = average

[smoothing]
noise_reduction = 20
monstercat = 20
