# Feeds the dashboard Now Playing card's circular spectrum ring
# (panels/DashboardMediaCard.qml) via services/VisualizerService.qml's
# `spectrum` property.
#
# A SEPARATE process/config from eq.conf on purpose: eq.conf's 4-bar cutoff
# split (50-10000 Hz) was hand-balanced for 4 bars specifically (see that
# file's own header) -- regrouping a 64-bar run of the same range into 4
# buckets would not reproduce that balance, and re-tuning eq.conf risked
# visibly changing island/Eq.qml's already-shipped pill meter. Running two
# small cava processes is cheap next to that risk, and both are gated so
# neither runs unless something on screen is actually reading it (see
# VisualizerService.qml's anyWindowVisible / anySpectrumVisible).
#
# bars = 64: matches the ring's bar count 1:1, no client-side re-bucketing.
# Same 50-10000 Hz range as eq.conf for a consistent low/high feel between
# the pill and the ring. framerate/smoothing follow eq.conf's own reasoning
# -- VisualizerService.qml layers its own attack/decay lerp on top either
# way, so there's nothing to gain from a twitchier source here.
#
# framerate: 240 -> 60 (27 Sep 2026, laptop pass, see eq.conf's own note).
# 240 was tuned for that desktop's 240Hz monitor; this machine's panel is a
# plain 60Hz output, so 60 is a 1:1 match to it rather than eq.conf's 30 --
# the ring redraws every real vsync instead of every other one, since a
# 64-bar ring reads more like "the actual spectrum" than the 4-bar pill
# meter and can afford twice eq.conf's rate for the same reason eq.conf
# argues 30 is already lossless there.

# framerate: 60 -> 30 (3 Oct 2026, battery pass). The only consumers are
# services/TempoService.qml, which resamples onto a fixed 20Hz grid (its
# header: dense enough for a 180 BPM beat), and the VinylDisc ring, whose
# bars are spring-smoothed per vsync on top (see eq.conf's argument that 30
# is already lossless for that). The edge visualizer has its own cava, so
# it does not read this config. On battery this process does not run at all
# (VisualizerService.qml's BATTERY GATE).

[general]
bars = 64
framerate = 30
autosens = 1
lower_cutoff_freq = 50
higher_cutoff_freq = 10000

[input]
method = pipewire
source = auto

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 1000
channels = mono
mono_option = average

[smoothing]
noise_reduction = 20
monstercat = 20
