# Theming (static palette from pen-drive rice, replaces wallpaper-generated theme)
include colors.conf

# Translucency -- background cells only, text glyphs stay fully opaque.
# Hyprland blurs behind through the alpha (see custom/rules.lua).
# text_composition_strategy boosts glyph contrast against the blurred
# background so text stays readable instead of washing out.
background_opacity 0.85
dynamic_background_opacity yes
text_composition_strategy 150 30

# Font
font_family      CaskaydiaCove Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size 13.0
modify_font cell_height +2px
disable_ligatures never

# Cursor
cursor_shape beam
cursor_trail 3

# Padding
window_padding_width 20 26
placement_strategy center

# Selection
selection_foreground none
selection_background none

# Undercurl & links
undercurl_style thin-dense
url_style curly
show_hyperlink_targets yes

# No stupid close confirmation
confirm_os_window_close 0

# Use zsh shell
shell zsh

# Wayland
wayland_titlebar_color background
hide_window_decorations yes

# Copy
map ctrl+c    copy_or_interrupt

# Search
map ctrl+f   launch --location=hsplit --allow-remote-control kitty +kitten search.py @active-kitty-window-id
map kitty_mod+f   launch --location=hsplit --allow-remote-control kitty +kitten search.py @active-kitty-window-id

# Scroll & Zoom
map page_up    scroll_page_up
map page_down    scroll_page_down

map ctrl+plus  change_font_size all +1
map ctrl+equal  change_font_size all +1
map ctrl+kp_add  change_font_size all +1
map ctrl+minus       change_font_size all -1
map ctrl+underscore       change_font_size all -1
map ctrl+kp_subtract       change_font_size all -1
map ctrl+0 change_font_size all 0
map ctrl+kp_0 change_font_size all 0
