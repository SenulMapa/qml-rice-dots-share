<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- qml-rice: macOS-like text. Layer 1 of the macOS-for-Hyprland spec. -->
<fontconfig>
  <match target="font">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting"   mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
    <edit name="rgba"      mode="assign"><const>none</const></edit>
    <edit name="lcdfilter" mode="assign"><const>lcdnone</const></edit>
  </match>
  <alias binding="strong"><family>system-ui</family>
    <prefer><family>SF Pro Text</family><family>SF Pro</family><family>Inter</family><family>Noto Sans</family></prefer></alias>
  <alias binding="strong"><family>-apple-system</family>
    <prefer><family>SF Pro Text</family><family>SF Pro</family><family>Inter</family><family>Noto Sans</family></prefer></alias>
  <alias binding="strong"><family>BlinkMacSystemFont</family>
    <prefer><family>SF Pro Text</family><family>SF Pro</family><family>Inter</family><family>Noto Sans</family></prefer></alias>
  <alias binding="strong"><family>sans-serif</family>
    <prefer><family>SF Pro Text</family><family>SF Pro</family><family>Inter</family><family>Noto Sans</family></prefer></alias>
  <alias binding="strong"><family>monospace</family>
    <prefer><family>JetBrains Mono</family><family>Noto Sans Mono</family></prefer></alias>
</fontconfig>
